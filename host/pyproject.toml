[project]
name = "voice-display-host"
version = "0.1.0"
description = "A host agent that turns an MCP server into a voice display"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.0.0",
  "starlette>=0.41",
  "uvicorn>=0.30",
  "anyio>=4.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed for the model router and Polly speech. The host runs without
# either: rule routing and the browser's own speechSynthesis.
aws = ["boto3>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_display_host"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
